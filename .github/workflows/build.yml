name: build

on:
  workflow_dispatch:
    inputs:
      mongoc-version:
        description: mongo-c-driver version to build, for example 1.30.12 or 2.5.5
        required: true
        type: string
      publish:
        description: Publish a GitHub release (public repository only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      mongoc-version:
        required: true
        type: string
      publish:
        type: boolean
        default: false

permissions:
  contents: read

env:
  MONGOC_VERSION: ${{ inputs.mongoc-version }}
  # MSVC toolset from Visual Studio 2022 17.14, installed side by side on the runner image.
  # Pinned so that a runner image update cannot change the compiler (and the runtime it needs).
  MSVC_TOOLSET: "14.44"
  # MongoDB C Driver Release Signing Key (keys/mongo-c-driver.asc, from https://pgp.mongodb.com/c-driver.asc)
  MONGOC_SIGNING_KEY: 6DB55D8223FF44E49DCB981344E76C0565ABC463
  # OpenSSL 3.5 is the current LTS branch: each build takes its latest release. Moving to another
  # branch is a deliberate change, since the OpenSSL DLL names follow the major version.
  OPENSSL_BRANCH: "3.5"
  # OpenSSL signing certificate (keys/openssl.asc, from https://openssl-library.org/source/pubkeys.asc)
  OPENSSL_SIGNING_KEY: B146647E45A7B33947AB226B2A2C87D161692D40
  # Assembler for OpenSSL's optimized code paths; the win64 build also assembles 32-bit objects.
  NASM_VERSION: 2.16.03
  NASM_SHA256: 3ee4782247bcb874378d02f7eab4e294a84d3d15f3f6ee2de2f47a46aa7226e6

jobs:
  # Resolved once, so that both architectures and the release notes use the same version.
  openssl:
    name: find the latest OpenSSL
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api --paginate 'repos/openssl/openssl/releases?per_page=100' \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed -n 's/^openssl-\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | awk -F. -v branch="$OPENSSL_BRANCH" '($1 "." $2) == branch' | sort -V | tail -n 1)
          if [ -z "$version" ]; then
            echo "::error::No OpenSSL $OPENSSL_BRANCH release found"
            exit 1
          fi
          echo "OpenSSL $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: windows (${{ matrix.arch }})
    needs: openssl
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcvars: x64
            openssl-target: VC-WIN64A
            openssl-dir: Program Files\OpenSSL
            dll-suffix: -x64
            machine: 8664 machine (x64)
          - arch: x86
            vcvars: x86
            openssl-target: VC-WIN32
            openssl-dir: Program Files (x86)\OpenSSL
            dll-suffix: ""
            machine: 14C machine (x86)
    env:
      OPENSSL_VERSION: ${{ needs.openssl.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PKG: libmongoc-windows-${{ inputs.mongoc-version }}-${{ matrix.arch }}
      OPENSSL_PREFIX: ${{ github.workspace }}\openssl-dist\${{ matrix.openssl-dir }}
      SSL_DLL: libssl-3${{ matrix.dll-suffix }}.dll
      CRYPTO_DLL: libcrypto-3${{ matrix.dll-suffix }}.dll
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the requested version
        run: |
          if ($env:MONGOC_VERSION -notmatch '^([12])\.\d+\.\d+$') {
            throw "Expected a 1.x or 2.x version such as 1.30.12 or 2.5.5, got '$env:MONGOC_VERSION'"
          }
          if ($matches[1] -eq '1') {
            # 1.x keeps the lib-prefixed names that Delphi FireDAC loads (upstream dropped them in 1.16).
            $names = 'BSON_BASENAME=libbson', 'MONGOC_BASENAME=libmongoc', 'BSON_NAME=libbson-1.0', 'MONGOC_NAME=libmongoc-1.0'
          } else {
            $names = 'BSON_BASENAME=bson', 'MONGOC_BASENAME=mongoc', 'BSON_NAME=bson2', 'MONGOC_NAME=mongoc2'
          }
          $names >> $env:GITHUB_ENV

      - name: Set up MSVC ${{ env.MSVC_TOOLSET }} (${{ matrix.vcvars }})
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio with the C++ tools was not found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          # Export what vcvarsall changes, so that later steps get cl, nmake, dumpbin and ninja.
          $vcvars = @{}
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.vcvars }} -vcvars_ver=$env:MSVC_TOOLSET >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $vcvars[$matches[1]] = $matches[2] }
          }
          if (-not ($vcvars['VCToolsVersion'] -like "$env:MSVC_TOOLSET.*")) {
            throw "MSVC $env:MSVC_TOOLSET is not installed in $vs"
          }
          foreach ($name in $vcvars.Keys) {
            if ($before[$name] -ne $vcvars[$name]) { "$name=$($vcvars[$name])" >> $env:GITHUB_ENV }
          }
          $display = & $vswhere -latest -products * -property catalog_productDisplayVersion
          Write-Host "MSVC $($vcvars['VCToolsVersion']) from Visual Studio $display"

      - name: Download and verify mongo-c-driver ${{ inputs.mongoc-version }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="mongo-c-driver-$MONGOC_VERSION.tar.gz"
          url="https://github.com/mongodb/mongo-c-driver/releases/download/$MONGOC_VERSION/$tarball"
          curl -fsSL -o "$tarball" "$url"
          curl -fsSL -o "$tarball.asc" "$url.asc"
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import keys/mongo-c-driver.asc
          gpg --batch --status-fd 1 --verify "$tarball.asc" "$tarball" > gpg-status.txt
          grep -Eq "^\[GNUPG:\] VALIDSIG .*$MONGOC_SIGNING_KEY\$" gpg-status.txt
          tar -xzf "$tarball"

      - name: Restore OpenSSL ${{ env.OPENSSL_VERSION }}
        id: openssl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openssl-dist
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}-msvc${{ env.MSVC_TOOLSET }}-2

      - name: Download and verify OpenSSL ${{ env.OPENSSL_VERSION }}
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="openssl-$OPENSSL_VERSION.tar.gz"
          url="https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/$tarball"
          curl -fsSL -o "$tarball" "$url"
          curl -fsSL -o "$tarball.asc" "$url.asc"
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import keys/openssl.asc
          gpg --batch --status-fd 1 --verify "$tarball.asc" "$tarball" > gpg-openssl.txt
          grep -Eq "^\[GNUPG:\] VALIDSIG .*$OPENSSL_SIGNING_KEY\$" gpg-openssl.txt

      - name: Build OpenSSL ${{ env.OPENSSL_VERSION }}
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'
          $tmp = $env:RUNNER_TEMP

          $nasmZip = Join-Path $tmp 'nasm.zip'
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$env:NASM_VERSION/win64/nasm-$env:NASM_VERSION-win64.zip" -OutFile $nasmZip
          if ((Get-FileHash $nasmZip -Algorithm SHA256).Hash -ne $env:NASM_SHA256) { throw 'NASM checksum mismatch' }
          Expand-Archive $nasmZip -DestinationPath $tmp
          $env:PATH = "$tmp\nasm-$env:NASM_VERSION;$env:PATH"

          # Windows tar: Git's GNU tar would read "D:" as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -xzf "openssl-$env:OPENSSL_VERSION.tar.gz" -C $tmp

          # OpenSSL needs a native Windows Perl, not the MSYS one that comes with Git.
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { throw "Strawberry Perl not found at $perl" }
          # Default install directories (Program Files, Common Files\SSL): they are baked into
          # the DLLs and are only writable by administrators. DESTDIR stages the files here.
          Push-Location (Join-Path $tmp "openssl-$env:OPENSSL_VERSION")
          & $perl Configure ${{ matrix.openssl-target }} no-docs no-tests no-makedepend
          nmake /nologo
          nmake /nologo install_sw "DESTDIR=$env:GITHUB_WORKSPACE\openssl-dist"
          Copy-Item LICENSE.txt $env:OPENSSL_PREFIX
          Pop-Location

      # Saved right away rather than at the end of the job, so a later failure does not
      # throw away a 15-minute build.
      - name: Save OpenSSL ${{ env.OPENSSL_VERSION }}
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openssl-dist
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}

      - name: Build mongo-c-driver
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Ninja with the MSVC environment set up above: independent of the Visual Studio version.
          cmake -S "mongo-c-driver-$env:MONGOC_VERSION" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DBSON_OUTPUT_BASENAME=$env:BSON_BASENAME" `
            "-DMONGOC_OUTPUT_BASENAME=$env:MONGOC_BASENAME" `
            -DENABLE_SSL=OPENSSL `
            "-DOPENSSL_ROOT_DIR=$env:OPENSSL_PREFIX" `
            -DENABLE_SASL=SSPI `
            -DENABLE_SRV=ON `
            -DENABLE_ZLIB=BUNDLED `
            -DENABLE_SNAPPY=OFF `
            -DENABLE_ZSTD=OFF `
            -DENABLE_CLIENT_SIDE_ENCRYPTION=OFF `
            -DENABLE_MONGODB_AWS_AUTH=ON `
            -DENABLE_STATIC=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_EXAMPLES=OFF `
            -DENABLE_UNINSTALL=OFF | Tee-Object -FilePath cmake-configure.log
          # The runner has other OpenSSL installations (system, Strawberry Perl): make sure ours was used.
          if (-not (Select-String -Path cmake-configure.log -SimpleMatch "version `"$env:OPENSSL_VERSION`"" -Quiet)) {
            throw "CMake did not pick up OpenSSL $env:OPENSSL_VERSION from $env:OPENSSL_PREFIX"
          }
          cmake --build build
          cmake --install build --prefix stage

      - name: Assemble the package
        run: |
          $pkg = "pkg\$env:PKG"
          New-Item -ItemType Directory "$pkg\bin", "$pkg\licenses\mongo-c-driver", "$pkg\licenses\openssl" -Force | Out-Null
          Copy-Item "stage\bin\$env:BSON_NAME.dll", "stage\bin\$env:MONGOC_NAME.dll" "$pkg\bin"
          Copy-Item "$env:OPENSSL_PREFIX\bin\$env:SSL_DLL", "$env:OPENSSL_PREFIX\bin\$env:CRYPTO_DLL" "$pkg\bin"
          # The Visual C++ runtime that the four DLLs import is not part of Windows, so it ships with them.
          # It comes from the Visual Studio of the image, newer than the pinned toolset: a runtime serves
          # the binaries of its own toolset and of the older ones, back to Visual Studio 2015.
          $runtime = @(Get-Item (Join-Path $env:VCToolsRedistDir "$env:ARCH\Microsoft.VC*.CRT\vcruntime140.dll") -ErrorAction SilentlyContinue)
          if ($runtime.Count -ne 1) { throw "Expected one $env:ARCH vcruntime140.dll in $env:VCToolsRedistDir" }
          Copy-Item $runtime[0].FullName "$pkg\bin"
          Copy-Item stage\include "$pkg\include" -Recurse
          Copy-Item stage\lib "$pkg\lib" -Recurse
          # share\mongo-c-driver on 1.x, share\mongo-c-driver\<version> on 2.x
          $notices = Get-ChildItem stage\share\mongo-c-driver -Recurse -Include COPYING, THIRD_PARTY_NOTICES
          if ($notices.Count -ne 2) { throw 'COPYING and THIRD_PARTY_NOTICES not found in the mongo-c-driver install' }
          $notices | Copy-Item -Destination "$pkg\licenses\mongo-c-driver"
          Copy-Item "$env:OPENSSL_PREFIX\LICENSE.txt" "$pkg\licenses\openssl"
          # The pkg-config files have the install prefix of this job, "stage": make them follow the package.
          # 2.x also asks for -lbson2 and -lmongoc2, which a linker reads as bson2.lib and mongoc2.lib, where
          # its import libraries are bson2.dll.lib and mongoc2.dll.lib: such a name gets its .dll.
          # CMake wrote the files with CRLF line endings: they get the LF they have on every other platform.
          foreach ($pc in Get-ChildItem "$pkg\lib\pkgconfig" -Filter *.pc) {
            $text = (Get-Content $pc.FullName -Raw) -replace "`r`n", "`n" -replace '(?m)^prefix=.*$', 'prefix=$${pcfiledir}/../..'
            $text = [regex]::Replace($text, '(?m)(?<=^Libs:.* -l)\S+', {
              param($lib) if (Test-Path "$pkg\lib\$lib.dll.lib") { "$lib.dll" } else { "$lib" } })
            Set-Content $pc.FullName $text -NoNewline
          }
          # The CMake files make every project that links the driver look for OpenSSL and link its import
          # libraries, which the package does not have: find_package() fails, or takes an OpenSSL of the
          # machine, of any version. A program that links the driver DLLs needs none, so this is taken out:
          # no TLS package to find, which upstream writes as NO in a Secure Channel build, and no OpenSSL
          # targets to link. The files are in lib\cmake\mongoc-1.0 on 1.x, lib\cmake\mongoc-<version> on 2.x.
          $cmake = @(Get-Item "$pkg\lib\cmake\*\mongoc-targets.cmake").DirectoryName
          $edits = @{ File = 'mongoc*config.cmake'; Old = 'tls_package [[OpenSSL]])'; New = 'tls_package [[NO]])' },
                   @{ File = 'mongoc-targets.cmake'; Old = 'OpenSSL::SSL;OpenSSL::Crypto;'; New = '' }
          foreach ($edit in $edits) {
            $file = @(Get-Item "$cmake\$($edit.File)")
            if ($file.Count -ne 1) { throw "Expected one $($edit.File) in lib\cmake, found $($file.Count)" }
            $text = Get-Content $file[0].FullName -Raw
            if (($text -csplit [regex]::Escape($edit.Old)).Count -ne 2) { throw "Expected one '$($edit.Old)' in $($file[0].Name)" }
            Set-Content $file[0].FullName $text.Replace($edit.Old, $edit.New) -NoNewline
          }
          Write-Host 'Installed by mongo-c-driver:'
          Get-ChildItem stage -Recurse -File | ForEach-Object { '  ' + $_.FullName.Substring((Resolve-Path stage).Path.Length + 1) }

      - name: Check the package
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = "pkg\$env:PKG\bin"
          $shipped = (Get-ChildItem $bin -Filter *.dll).Name
          $windows = if ($env:ARCH -eq 'x86') { "$env:SystemRoot\SysWOW64" } else { "$env:SystemRoot\System32" }
          foreach ($dll in Get-ChildItem $bin -Filter *.dll) {
            $headers = dumpbin /nologo /headers $dll.FullName
            if (-not ($headers -match [regex]::Escape('${{ matrix.machine }}'))) { throw "$($dll.Name) is not ${{ matrix.machine }}" }
            $deps = @(dumpbin /nologo /dependents $dll.FullName | Where-Object { $_ -match '^\s+\S+\.dll$' } | ForEach-Object { $_.Trim() })
            Write-Host "$($dll.Name) ($($dll.VersionInfo.ProductVersion)) -> $($deps -join ', ')"
            foreach ($dep in $deps) {
              if ($shipped -contains $dep -or $dep -like 'api-ms-win-*') { continue }
              # The runner has the Visual C++ runtime in its Windows directory; a user's machine may not.
              if ($dep -notmatch '^(vcruntime|msvcp|concrt|vcomp)' -and (Test-Path (Join-Path $windows $dep))) { continue }
              throw "$($dll.Name) depends on $dep, which is neither in the package nor part of Windows"
            }
            if ($dll.Name -eq "$env:MONGOC_NAME.dll") {
              foreach ($required in "$env:BSON_NAME.dll", $env:SSL_DLL, $env:CRYPTO_DLL) {
                if ($deps -notcontains $required) { throw "$($dll.Name) does not import $required" }
              }
            }
          }
          foreach ($name in "$env:BSON_NAME.dll", "$env:MONGOC_NAME.dll") {
            $version = (Get-Item "$bin\$name").VersionInfo.ProductVersion
            if ($version -ne $env:MONGOC_VERSION) { throw "$name reports version $version" }
          }
          foreach ($name in $env:SSL_DLL, $env:CRYPTO_DLL) {
            $version = (Get-Item "$bin\$name").VersionInfo.ProductVersion
            if ($version -ne $env:OPENSSL_VERSION) { throw "$name reports version $version" }
          }
          $runtime = (Get-Item "$bin\vcruntime140.dll").VersionInfo
          if ([version]::new($runtime.FileMajorPart, $runtime.FileMinorPart) -lt [version]$env:MSVC_TOOLSET) {
            throw "vcruntime140.dll $($runtime.FileVersion) is older than the MSVC $env:MSVC_TOOLSET toolset"
          }
          # The pkg-config files may only name directories of the package: a drive letter (not the colon of
          # a URL) would be a path of this runner.
          $absolute = Select-String -Path "pkg\$env:PKG\lib\pkgconfig\*.pc" -Pattern '[A-Za-z]:[\\/](?!/)'
          if ($absolute) { throw "Absolute path in a pkg-config file: $absolute" }

      - name: Create TLS test certificates
        shell: bash
        run: bash test/tls-certs.sh

      - name: Smoke test (mutual TLS against mongod)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pkg = (Resolve-Path "pkg\$env:PKG").Path
          $tls = (Resolve-Path tls).Path -replace '\\', '/'
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory $smoke -Force | Out-Null
          Copy-Item "$pkg\bin\*.dll" $smoke
          # Compiled through the pkg-config files of the package, which tests them as well. The runner has
          # the pkg-config of Strawberry Perl, without --msvc-syntax: -L and -l are turned here into what
          # link expects, /LIBPATH: and the file name of the import library.
          $env:PKG_CONFIG_PATH = "$pkg\lib\pkgconfig"
          $cflags = -split (pkg-config --cflags $env:MONGOC_NAME)
          $libs = (-split (pkg-config --libs $env:MONGOC_NAME)) -creplace '^-L', '/LIBPATH:' -creplace '^-l(.+)', '$1.lib'
          Write-Host "$((Get-Command pkg-config).Source) $env:MONGOC_NAME -> $cflags $libs"
          Push-Location $smoke
          cl /nologo /W3 /std:c11 @cflags "$env:GITHUB_WORKSPACE\test\smoke.c" /link @libs

          $mongod = Get-ChildItem 'C:\Program Files\MongoDB\Server\*\bin\mongod.exe' | Sort-Object FullName | Select-Object -Last 1
          if (-not $mongod) { throw 'mongod was not found on the runner' }
          $data = Join-Path $env:RUNNER_TEMP 'mongo-data'
          $log = Join-Path $env:RUNNER_TEMP 'mongod.log'
          New-Item -ItemType Directory $data -Force | Out-Null
          # A client certificate is required: tlsCAFile without tlsAllowConnectionsWithoutCertificates.
          $server = Start-Process $mongod.FullName -PassThru -NoNewWindow -ArgumentList @(
            '--dbpath', $data, '--port', '27018', '--bind_ip', '127.0.0.1', '--logpath', $log,
            '--tlsMode', 'requireTLS', '--tlsCertificateKeyFile', "$tls/server.pem", '--tlsCAFile', "$tls/ca.pem")
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ($true) {
              try { [Net.Sockets.TcpClient]::new('127.0.0.1', 27018).Dispose(); break }
              catch { if ((Get-Date) -gt $deadline) { throw 'mongod did not start' }; Start-Sleep -Seconds 1 }
            }
            # Only the package and Windows on the DLL search path: the package has to be self-contained.
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            .\smoke.exe $env:MONGOC_VERSION "mongodb://127.0.0.1:27018/?tls=true&tlsCAFile=$tls/ca.pem&tlsCertificateKeyFile=$tls/client.pem&serverSelectionTimeoutMS=20000"
          } catch {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Smoke test (CMake package)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pkg = (Resolve-Path "pkg\$env:PKG").Path -replace '\\', '/'
          $build = Join-Path $env:RUNNER_TEMP 'smoke-cmake'
          # As the README says: the extracted folder in CMAKE_PREFIX_PATH and nothing else. The runner has an
          # OpenSSL that CMake finds, 64-bit only, and a user's machine may have none: the package must not
          # ask for one, so CMake is told to refuse the search. Nothing reads that setting when the package
          # is right, which CMake would report as a warning.
          cmake -S test -B $build -G Ninja -Wno-unused-cli -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$pkg" `
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
          if (-not (Select-String -Path "$build\CMakeCache.txt" -SimpleMatch "mongoc_DIR:PATH=$pkg/lib/cmake/" -Quiet)) {
            throw "CMake did not take the mongoc package from $pkg"
          }
          cmake --build $build
          Copy-Item "$pkg/bin/*.dll" $build
          # Only the package and Windows on the DLL search path, as above.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$build\smoke.exe" $env:MONGOC_VERSION

      - name: Zip
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory dist -Force | Out-Null
          Push-Location pkg
          7z a -tzip -mx=9 "..\dist\$env:PKG.zip" $env:PKG | Out-Null
          Pop-Location
          $runtime = (Get-Item "pkg\$env:PKG\bin\vcruntime140.dll").VersionInfo.FileVersion
          # The toolset, not the Visual Studio that hosts it: that one is newer and does not compile the DLLs.
          "MSVC $env:VCToolsVersion toolset, Visual C++ runtime $runtime, GitHub runner image $env:ImageOS $env:ImageVersion" |
            Set-Content "dist\toolchain-$env:ARCH.txt"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG }}
          path: dist/
          if-no-files-found: error

  linux:
    name: linux (x64)
    # Ubuntu 24.04 is the oldest release the libraries are built for: they need its glibc or a later one.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PKG: libmongoc-linux-${{ inputs.mongoc-version }}-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the requested version
        run: |
          set -euo pipefail
          if [[ ! "$MONGOC_VERSION" =~ ^([12])\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a 1.x or 2.x version such as 1.30.12 or 2.5.5, got '$MONGOC_VERSION'"
            exit 1
          fi
          # libbson-1.0.so.0 and libmongoc-1.0.so.0 on 1.x, libbson2.so.2 and libmongoc2.so.2 on 2.x
          if [ "${BASH_REMATCH[1]}" = 1 ]; then
            printf '%s\n' BSON_LIB=bson-1.0 MONGOC_LIB=mongoc-1.0 MONGOC_PC=libmongoc-1.0 >> "$GITHUB_ENV"
          else
            printf '%s\n' BSON_LIB=bson2 MONGOC_LIB=mongoc2 MONGOC_PC=mongoc2 >> "$GITHUB_ENV"
          fi

      - name: Install the OpenSSL, Cyrus SASL and zlib headers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev libsasl2-dev zlib1g-dev pkg-config

      - name: Download and verify mongo-c-driver ${{ inputs.mongoc-version }}
        run: |
          set -euo pipefail
          tarball="mongo-c-driver-$MONGOC_VERSION.tar.gz"
          url="https://github.com/mongodb/mongo-c-driver/releases/download/$MONGOC_VERSION/$tarball"
          curl -fsSL -o "$tarball" "$url"
          curl -fsSL -o "$tarball.asc" "$url.asc"
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import keys/mongo-c-driver.asc
          gpg --batch --status-fd 1 --verify "$tarball.asc" "$tarball" > gpg-status.txt
          grep -Eq "^\[GNUPG:\] VALIDSIG .*$MONGOC_SIGNING_KEY\$" gpg-status.txt
          tar -xzf "$tarball"

      - name: Build mongo-c-driver
        run: |
          set -euo pipefail
          # OpenSSL, Cyrus SASL and zlib are those of the distribution, which keeps them up to date: nothing
          # is bundled, unlike on Windows. The $ORIGIN run path makes libmongoc find libbson next to it,
          # wherever the package is extracted.
          cmake -S "mongo-c-driver-$MONGOC_VERSION" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_LIBDIR=lib \
            '-DCMAKE_INSTALL_RPATH=$ORIGIN' \
            -DENABLE_SSL=OPENSSL \
            -DENABLE_SASL=CYRUS \
            -DENABLE_SRV=ON \
            -DENABLE_ZLIB=SYSTEM \
            -DENABLE_SNAPPY=OFF \
            -DENABLE_ZSTD=OFF \
            -DENABLE_CLIENT_SIDE_ENCRYPTION=OFF \
            -DENABLE_MONGODB_AWS_AUTH=ON \
            -DENABLE_STATIC=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_UNINSTALL=OFF
          cmake --build build
          cmake --install build --prefix stage --strip

      - name: Assemble the package
        run: |
          set -euo pipefail
          pkg="pkg/$PKG"
          mkdir -p "$pkg/licenses/mongo-c-driver"
          cp -a stage/include stage/lib "$pkg"
          # share/mongo-c-driver on 1.x, share/mongo-c-driver/<version> on 2.x
          mapfile -t notices < <(find stage/share/mongo-c-driver -name COPYING -o -name THIRD_PARTY_NOTICES)
          if [ "${#notices[@]}" -ne 2 ]; then
            echo "::error::COPYING and THIRD_PARTY_NOTICES not found in the mongo-c-driver install"
            exit 1
          fi
          cp "${notices[@]}" "$pkg/licenses/mongo-c-driver"
          # The pkg-config files have the install prefix of this job, "stage": make them follow the package.
          sed -i 's|^prefix=.*|prefix=${pcfiledir}/../..|' "$pkg"/lib/pkgconfig/*.pc
          echo 'Installed by mongo-c-driver:'
          (cd stage && find . ! -type d | sort | sed 's|^\./|  |')

      - name: Check the package
        run: |
          set -euo pipefail
          lib="pkg/$PKG/lib"
          bson="$lib/lib$BSON_LIB.so"
          mongoc="$lib/lib$MONGOC_LIB.so"
          dynamic() { readelf -d "$2" | sed -n "s/.*($1).*\[\(.*\)\]/\1/p"; }
          # What the libraries may load from the system: glibc, OpenSSL 3, Cyrus SASL and zlib.
          system='ld-linux-x86-64.so.2 libc.so.6 libm.so.6 libresolv.so.2 libssl.so.3 libcrypto.so.3 libsasl2.so.2 libz.so.1'
          for file in "$bson" "$mongoc"; do
            name=$(dynamic SONAME "$file")
            deps=$(dynamic NEEDED "$file" | xargs)
            echo "$name -> $deps"
            if [ "$(readelf -h "$file" | sed -n 's/^ *Machine: *//p')" != 'Advanced Micro Devices X86-64' ]; then
              echo "::error::$name is not an x86-64 library"
              exit 1
            fi
            # The dynamic linker looks for this name, which is a link to the library.
            if [ ! -e "$lib/$name" ]; then
              echo "::error::$name is not in the package"
              exit 1
            fi
            for dep in $deps; do
              if [[ " $system $(dynamic SONAME "$bson") " != *" $dep "* ]]; then
                echo "::error::$name depends on $dep, which is neither in the package nor expected on the system"
                exit 1
              fi
            done
          done
          # $name and $deps are now those of libmongoc.
          for required in "$(dynamic SONAME "$bson")" libssl.so.3 libcrypto.so.3; do
            if [[ " $deps " != *" $required "* ]]; then
              echo "::error::$name does not load $required"
              exit 1
            fi
          done
          if [ "$(dynamic RUNPATH "$mongoc")" != '$ORIGIN' ]; then
            echo "::error::$name does not look for libbson in its own directory (\$ORIGIN run path)"
            exit 1
          fi

      - name: Create TLS test certificates
        run: bash test/tls-certs.sh

      - name: Smoke test (mutual TLS against mongod, on Ubuntu 24.04 and 26.04)
        run: |
          set -euo pipefail
          pkg="$PWD/pkg/$PKG"
          tls="$PWD/tls"
          # Compiled through the pkg-config files of the package, which tests them as well.
          flags=$(PKG_CONFIG_PATH="$pkg/lib/pkgconfig" pkg-config --cflags --libs "$MONGOC_PC")
          echo "pkg-config $MONGOC_PC: $flags"
          mkdir smoke
          cc -std=gnu11 -Wall test/smoke.c -o smoke/smoke $flags

          # The runner image has no mongod: it runs from the official container image, on the host network.
          # A client certificate is required: tlsCAFile without tlsAllowConnectionsWithoutCertificates.
          docker run --detach --name mongod --network host --volume "$tls:/tls:ro" mongo:8.0 \
            --port 27018 --bind_ip 127.0.0.1 --tlsMode requireTLS \
            --tlsCertificateKeyFile /tls/server.pem --tlsCAFile /tls/ca.pem > /dev/null
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs --tail 40 mongod; fi; docker rm --force mongod > /dev/null' EXIT
          if ! timeout 60 bash -c 'until (: < /dev/tcp/127.0.0.1/27018) 2> /dev/null; do sleep 1; done'; then
            echo "::error::mongod did not start"
            exit 1
          fi

          # Fresh images with only the packages the README asks for: the package has to be self-contained.
          uri="mongodb://127.0.0.1:27018/?tls=true&tlsCAFile=/tls/ca.pem&tlsCertificateKeyFile=/tls/client.pem&serverSelectionTimeoutMS=20000"
          for image in ubuntu:24.04 ubuntu:26.04; do
            echo "$image"
            docker run --rm --network host \
              --volume "$pkg:/pkg:ro" --volume "$PWD/smoke:/smoke:ro" --volume "$tls:/tls:ro" \
              --env DEBIAN_FRONTEND=noninteractive --env BSON_LIB --env MONGOC_LIB --env MONGOC_VERSION --env "URI=$uri" \
              "$image" bash -euo pipefail -c '
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends libssl3t64 libsasl2-2 > /dev/null
                # Without LD_LIBRARY_PATH, as an application that loads libmongoc by its path: libbson
                # has to come from the run path of libmongoc.
                ldd "/pkg/lib/lib$MONGOC_LIB.so" | tee /tmp/ldd.txt
                if grep -q "not found" /tmp/ldd.txt || ! grep -q "lib$BSON_LIB\.so.* => /pkg/lib/" /tmp/ldd.txt; then
                  echo "::error::libmongoc does not find its dependencies"
                  exit 1
                fi
                LD_LIBRARY_PATH=/pkg/lib /smoke/smoke "$MONGOC_VERSION" "$URI"'
          done

      - name: Archive
        run: |
          set -euo pipefail
          mkdir dist
          tar -C pkg --owner=0 --group=0 --numeric-owner -czf "dist/$PKG.tar.gz" "$PKG"
          echo "GCC $(gcc -dumpfullversion), $(getconf GNU_LIBC_VERSION), GitHub runner image $ImageOS $ImageVersion" \
            > dist/toolchain-linux-x64.txt
          cat dist/toolchain-linux-x64.txt
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PKG }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [openssl, windows, linux]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ inputs.mongoc-version }}
      OPENSSL_VERSION: ${{ needs.openssl.outputs.version }}
    steps:
      - name: Check the repository is public
        run: |
          # Artifact attestations are only available to public repositories on this plan.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != "false" ]; then
            echo "::error::Releases are only published from the public repository."
            exit 1
          fi

      # Only this version: the weekly check builds 1.x and 2.x in the same workflow run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libmongoc-*-${{ inputs.mongoc-version }}-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum libmongoc-windows-*.zip libmongoc-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          for zip in libmongoc-windows-*.zip; do
            name="${zip%.zip}"
            unzip -q "$zip" "$name/bin/*.dll" -d ../dlls
          done
          mkdir ../libs
          for tarball in libmongoc-linux-*.tar.gz; do
            tar -xzf "$tarball" -C ../libs --wildcards '*/lib/*.so*'
          done
          # The libraries only: the .so and .so.<major> names are links to them.
          find ../libs -type l -delete

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/libmongoc-windows-*.zip
            dist/libmongoc-linux-*.tar.gz
            dlls/**/*.dll
            libs/**/*.so.*

      - name: Publish the release
        run: |
          set -euo pipefail
          # 2.x is the current branch and gets the "Latest" badge; 1.x releases are listed without it.
          if [[ "$MONGOC_VERSION" == 1.* ]]; then
            latest=false
            dlls='`libmongoc-1.0.dll` and `libbson-1.0.dll`, the lib-prefixed names that Delphi FireDAC loads'
            libs='`libmongoc-1.0.so.0` and `libbson-1.0.so.0`'
          else
            latest=true
            dlls='`mongoc2.dll` and `bson2.dll`'
            libs='`libmongoc2.so.2` and `libbson2.so.2`'
          fi
          {
            echo "Unofficial Windows and Linux builds of [mongo-c-driver $MONGOC_VERSION](https://github.com/mongodb/mongo-c-driver/releases/tag/$MONGOC_VERSION)."
            echo
            echo "**Windows**, x64 and x86: copy the DLLs from \`bin/\` next to your executable."
            echo
            echo "- DLLs: $dlls"
            echo "- OpenSSL $OPENSSL_VERSION"
            echo "- $(cat dist/toolchain-x64.txt)"
            echo
            echo "**Linux**, x64, Ubuntu 24.04 and later: extract the archive and load the libraries from \`lib/\`."
            echo
            echo "- Libraries: $libs"
            echo "- OpenSSL 3, Cyrus SASL and zlib from the distribution"
            echo "- $(cat dist/toolchain-linux-x64.txt)"
            echo
            echo "The [README](https://github.com/$GITHUB_REPOSITORY#readme) lists the requirements and how to verify the files:"
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS'
            echo "gh attestation verify libmongoc-windows-$MONGOC_VERSION-x64.zip --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/libmongoc-windows-*.zip dist/libmongoc-linux-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest="$latest" \
            --title "libmongoc $MONGOC_VERSION" --notes-file notes.md
